# This inventory describe a HA typology with stacked etcd (== same nodes as control plane)
# and 3 worker nodes
# See https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
# for tips on building your # inventory

# Configure 'ip' variable to bind kubernetes services on a different ip than the default iface
# We should set etcd_member_name for etcd cluster. The node that are not etcd members do not need to set the value,
# or can set the empty string value.
[kube_control_plane]
node1 ansible_host=10.0.29.236
node2 ansible_host=10.0.14.119
node3 ansible_host=10.0.57.200

[etcd:children]
kube_control_plane

[kube_node]
worker-large-node1    ansible_host=10.0.27.183
worker-large-node2    ansible_host=10.0.51.60
worker-large-node3    ansible_host=10.0.31.20
worker-large-node4    ansible_host=10.0.36.230

[nodes_zone_a]
worker-large-node1
worker-large-node2

[nodes_zone_b]
worker-large-node3
worker-large-node4


[haproxy]
haproxy1 ansible_host=10.0.48.161
haproxy2 ansible_host=10.0.16.178
