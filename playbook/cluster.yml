---
- name: Setup nodes k8s-common (OS, network, firewall, sysctl, kernel modules, etc.)
  tags:
    - k8s
    - pre-setup
  hosts:
    - kube_control_plane
    - kube_node
  roles:
    - k8s_common

- name: Install Kubernetes
  tags:
    - k8s
  ansible.builtin.import_playbook: kubernetes_sigs.kubespray.cluster


- name: Install and configure HAProxy + keepalived
  tags:
    - lb
  hosts: haproxy
  roles:
    - haproxy_keepalived